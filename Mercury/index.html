<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020305" />
    <meta name="description" content="A slowly rotating Mercury in a quiet star field, using NASA's 3D globe." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23918c85'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
    <title>Mercury — Ambience</title>
  </head>
  <body>
    <main aria-label="Mercury viewer">
      <canvas id="mercury" tabindex="0" role="img" aria-label="Rotating Mercury in space. Drag or use arrow keys to rotate; scroll, pinch, or use plus and minus to zoom. Ctrl Shift R reveals controls."></canvas>
      <div id="status" role="status" aria-live="polite">Preparing Mercury…</div>
      <div id="interface" hidden>
        <header class="title"><span class="eyebrow">THE INNERMOST PLANET</span><h1>Mercury<span>.</span></h1></header>
        <p class="hint">Drag to rotate · Scroll to zoom<br>Ctrl + Shift + R to hide controls</p>
        <footer class="toolbar" aria-label="Scene controls">
          <label for="speed">Rotation speed <output id="speed-value" for="speed">1.00×</output></label>
          <input id="speed" type="range" min="0" max="20" step="0.05" value="1" />
          <div class="buttons">
            <button id="rotation" type="button" aria-pressed="true">Pause rotation</button>
            <button id="zoom-out" type="button" aria-label="Zoom Mercury out">−</button>
            <button id="zoom-in" type="button" aria-label="Zoom Mercury in">+</button>
            <button id="reset" type="button">Reset view</button>
          </div>
          <a class="credit" href="https://science.nasa.gov/resource/mercury-3d-model/" target="_blank" rel="noopener noreferrer">Model: NASA / VTAD</a>
        </footer>
      </div>
      <noscript>Enable JavaScript to view Mercury.</noscript>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
